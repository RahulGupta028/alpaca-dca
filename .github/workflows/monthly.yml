name: Monthly limit buy for fractional order but keeping GTD orders alive

on:
  schedule:
    - cron: "30 14 * * 1-5"  # 09:30 EST
    - cron: "30 13 * * 1-5"  # 09:30 EDT
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py pytz

      - name: Run trade script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # <-- required for committing state
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true" 
          FORCE_CREATE_TRANCHES: "false"
        run: python trade.py